<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOATING HOLIDAY TRACKER</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amberCustom: '#f59e0b',
                        amberDark: '#b45309',
                        blueCustom: '#1e3a8a',
                        navyCustom: '#0f172a',
                    }
                }
            }
        }
    </script>
    <style>
        /* 1. TODAS LAS LETRAS TAMAÑO ARIAL 14PX */
        * {
            font-family: Arial, Helvetica, sans-serif !important;
            font-size: 14px !important;
            line-height: 1.4 !important;
        }

        /* Margen horizontal izquierdo ajustado a 5 mm antes del botón flotante */
        body {
            padding-left: 67px !important;
        }

        /* Base Gridlines & Table Borders in Blue for light theme now */
        table, th, td {
            border: 1.5px solid #2563eb !important;
        }

        /* Custom Status Conditional Styles */
        .status-attended {
            background-color: #15803d !important; /* Bold Green */
            color: #ffffff !important;           /* Bold White Text */
            font-weight: 700;
        }
        .status-scheduled {
            background-color: #4b5563 !important; /* Bold Gray */
            color: #ffffff !important;           /* Bold White Text */
            font-weight: 700;
        }
        .status-not-attended {
            background-color: #0369a1 !important; /* Bold Peacock Blue */
            color: #ffffff !important;           /* Bold White Text */
            font-weight: 700;
        }
        .status-expired {
            background-color: #b91c1c !important; /* Bold Red */
            color: #ffffff !important;           /* Bold White Text */
            font-weight: 700;
        }
        .status-vacation {
            background-color: #86efac !important; /* Light Green */
            color: #000000 !important;           /* Bold Black Text */
            font-weight: 800;
        }

        /* Granted & Outcome Tag Styles */
        .taken-active {
            background-color: #bae6fd !important; /* Light Blue */
            color: #000000 !important;           /* Bold Black Text */
            font-weight: 800;
        }
        .not-granted-active {
            background-color: #fca5a5 !important; /* Light Red */
            color: #000000 !important;           /* Bold Black Text */
            font-weight: 800;
        }
        .expired-active {
            background-color: #b91c1c !important; /* Bold Red */
            color: #ffffff !important;           /* Bold White Text */
            font-weight: 800;
        }
        .vacation-active {
            background-color: #86efac !important; /* Light Green */
            color: #000000 !important;           /* Bold Black Text */
            font-weight: 800;
        }
    </style>
</head>
<!-- Fondo base: azul claro en vez de ambar claro -->
<body class="bg-blue-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 p-2 md:p-6 min-h-screen transition-colors duration-200">

    <!-- Header Principal -->
    <!-- Fondos ambar -> azul, Letras azules -> ambar -->
    <header class="bg-blue-500 border-4 border-blue-600 rounded-lg p-5 mb-6 shadow-xl text-center">
        <h1 class="font-black text-amber-500 tracking-wider uppercase">
            FLOATING HOLIDAY TRACKER
        </h1>
        <p class="text-amber-400 font-bold mt-1 uppercase tracking-widest">
            Full Annual Calendar & Agent Attendance Tracking System
        </p>
    </header>

    <!-- Filters & Quick Actions Bar -->
    <!-- Fondo azul oscuro -> ambar, bordes ambar -> azul -->
    <section class="bg-amber-500 dark:bg-slate-900 border-2 border-blue-400 rounded-lg p-4 mb-6 shadow-md text-white">
        <div class="flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Branch Filter -->
            <div class="w-full md:w-1/2">
                <label class="block font-bold uppercase mb-1 text-blue-900">Filter by Branch:</label>
                <select id="branchFilter" onchange="applyFilters()" class="w-full p-2.5 rounded bg-blue-100 dark:bg-slate-800 text-amber-600 dark:text-amber-300 font-extrabold border-2 border-blue-500 focus:outline-none">
                    <option value="GUA">GUA (Guatemala)</option>
                    <option value="COL">COLOMBIA</option>
                    <option value="AH">AFTER HOURS</option>
                </select>
            </div>

            <!-- Agent Search -->
            <div class="w-full md:w-1/2">
                <label class="block font-bold uppercase mb-1 text-blue-900">Search Agent:</label>
                <input type="text" id="searchFilter" onkeyup="applyFilters()" placeholder="Type agent name..." class="w-full p-2 rounded bg-blue-100 dark:bg-slate-800 text-amber-600 dark:text-slate-100 font-bold border-2 border-blue-500 focus:outline-none placeholder-amber-600/50 dark:placeholder-slate-400">
            </div>

            <!-- Add Agent Action Button -->
            <!-- Boton ambar -> azul, Letras azules -> ambar -->
            <div class="w-full md:w-auto flex items-end justify-end">
                <button onclick="protectedAction(openAddModal)" class="w-full md:w-auto bg-blue-500 hover:bg-blue-400 text-amber-400 font-black px-5 py-2.5 rounded border-2 border-blue-600 uppercase tracking-wider shadow whitespace-nowrap">
                    + Add New Agent
                </button>
            </div>

        </div>
    </section>

    <!-- Main Agents Container -->
    <main id="agentsContainer" class="space-y-8">
        <!-- Rendered dynamically via JavaScript -->
    </main>

    <!-- Botón Flotante Pequeño SOLO con Ícono -->
    <div class="fixed bottom-3 left-3 z-50">
        <button onclick="toggleDarkMode()" class="bg-blue-500 hover:bg-blue-400 text-amber-400 p-2 rounded-full border-2 border-blue-700 shadow-2xl transition-transform active:scale-90 flex items-center justify-center w-9 h-9" title="Toggle Light/Dark Mode">
            <span id="themeIcon">🌙</span>
        </button>
    </div>

    <!-- Password Auth Pop-up Modal -->
    <div id="passwordAuthModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-[#ffeb99] dark:bg-slate-900 border-4 border-blue-500 rounded-xl p-6 w-full max-w-sm shadow-2xl text-slate-900 dark:text-slate-100">
            <h3 class="font-black text-amber-600 dark:text-amber-400 uppercase mb-2 text-center">Authentication Required</h3>
            <p class="font-bold text-slate-600 dark:text-slate-300 uppercase mb-4 text-center">Please enter the management password to proceed.</p>
            
            <div class="space-y-4 font-bold">
                <div>
                    <label class="block mb-1 text-slate-700 dark:text-slate-300 uppercase">Management Password:</label>
                    <input type="password" id="authPasswordInput" placeholder="Password..." class="w-full p-2 border-2 border-blue-400 rounded focus:outline-none bg-blue-50 dark:bg-slate-800 text-amber-600 dark:text-slate-100">
                    <p id="authErrorMessage" class="text-red-600 dark:text-red-400 font-bold mt-1.5 hidden">Incorrect password. Access denied.</p>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button onclick="closePasswordModal()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded font-bold uppercase">Cancel</button>
                <button onclick="submitPasswordAuth()" class="px-4 py-2 bg-blue-500 text-amber-400 font-black rounded uppercase hover:bg-blue-400">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Modal for Edit / Add Agent -->
    <div id="agentModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-[#ffeb99] dark:bg-slate-900 border-4 border-blue-500 rounded-xl p-6 w-full max-w-md shadow-2xl text-slate-900 dark:text-slate-100">
            <h3 id="modalTitle" class="font-black text-amber-600 dark:text-amber-400 uppercase mb-4">Edit Agent Information</h3>
            <input type="hidden" id="editAgentIndex">
            
            <div class="space-y-4 font-bold">
                <div>
                    <label class="block mb-1 text-slate-700 dark:text-slate-300 uppercase">Agent Name:</label>
                    <input type="text" id="modalName" class="w-full p-2 border-2 border-blue-400 rounded focus:outline-none bg-blue-50 dark:bg-slate-800 text-amber-600 dark:text-slate-100">
                </div>
                <div>
                    <label class="block mb-1 text-slate-700 dark:text-slate-300 uppercase">Email Address:</label>
                    <input type="email" id="modalEmail" placeholder="agent@gohighway.com" class="w-full p-2 border-2 border-blue-400 rounded focus:outline-none bg-blue-50 dark:bg-slate-800 text-amber-600 dark:text-slate-100">
                </div>
                <div>
                    <label class="block mb-1 text-slate-700 dark:text-slate-300 uppercase">Branch:</label>
                    <select id="modalBranch" class="w-full p-2 border-2 border-blue-400 rounded focus:outline-none bg-blue-50 dark:bg-slate-800 text-amber-600 dark:text-slate-100">
                        <option value="GUA">GUA</option>
                        <option value="COL">COL</option>
                        <option value="AH">AH</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1 text-slate-700 dark:text-slate-300 uppercase">Team:</label>
                    <input type="text" id="modalTeam" class="w-full p-2 border-2 border-blue-400 rounded focus:outline-none bg-blue-50 dark:bg-slate-800 text-amber-600 dark:text-slate-100">
                </div>
                <div>
                    <label class="block mb-1 text-slate-700 dark:text-slate-300 uppercase">Supervisor:</label>
                    <input type="text" id="modalSupervisor" class="w-full p-2 border-2 border-blue-400 rounded focus:outline-none bg-blue-50 dark:bg-slate-800 text-amber-600 dark:text-slate-100">
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded font-bold uppercase">Cancel</button>
                <button onclick="saveAgent()" class="px-4 py-2 bg-blue-500 text-amber-400 font-black rounded uppercase hover:bg-blue-400">Save Agent</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Data & Logic -->
    <script>
        const AUTH_PASSWORD = "management2026!";
        let pendingActionCallback = null;

        const monthsData = [
            { name: "January", days: 31, startDay: 4, holidays: { 1: { name: "New Years Day", cat: "Major", exp: "Expires end of year" }, 19: { name: "MLK Day", cat: "Minor", exp: "Exp: Apr 19" } } },
            { name: "February", days: 28, startDay: 0, holidays: { 16: { name: "Presidents Day", cat: "Minor", exp: "Exp: May 16" } } },
            { name: "March", days: 31, startDay: 0, holidays: {} },
            { name: "April", days: 30, startDay: 3, holidays: { 3: { name: "Good Friday", cat: "Minor", exp: "Exp: Jul 3" } } },
            { name: "May", days: 31, startDay: 5, holidays: { 25: { name: "Memorial Day", cat: "Middle", exp: "Exp: Aug 25" } } },
            { name: "June", days: 30, startDay: 1, holidays: {} },
            { name: "July", days: 31, startDay: 3, holidays: { 4: { name: "4th of July", cat: "Major", exp: "Exp: Oct 4" } } },
            { name: "August", days: 31, startDay: 6, holidays: {} },
            { name: "September", days: 30, startDay: 2, holidays: { 7: { name: "Labor Day", cat: "Middle", exp: "Exp: Dec 7" } } },
            { name: "October", days: 31, startDay: 4, holidays: { 12: { name: "Columbus Day", cat: "Minor", exp: "Exp: Jan 12" } } },
            { name: "November", days: 30, startDay: 0, holidays: { 11: { name: "Veterans Day", cat: "Minor", exp: "Exp: Feb 11" }, 26: { name: "Thanksgiving", cat: "Major", exp: "Exp: Feb 26" } } },
            { name: "December", days: 31, startDay: 2, holidays: { 25: { name: "Christmas Eve", cat: "Major", exp: "Expires end of year" }, 31: { name: "NY Eve", cat: "Middle", exp: "Expires end of year" } } }
        ];

        const defaultEmployees = [
            // Guatemala Team
            { id: "emp_1", name: "Andrea Mansilla", email: "andrea@gohighway.com", team: "Management", branch: "GUA", supervisor: "Jorge Garrido" },
            { id: "emp_2", name: "Daniel E. Hernandez Soto", email: "daniel.hernandez@gohighway.com", team: "Management", branch: "GUA", supervisor: "Jorge Garrido" },
            { id: "emp_3", name: "Jonathan Mejia", email: "jonathan@gohighway.com", team: "Management", branch: "GUA", supervisor: "Jorge Garrido" }
            // (Los demás agentes persisten en tu localStorage o los puedes re-insertar aquí)
        ];

        let employees = JSON.parse(localStorage.getItem('fht_employees')) || defaultEmployees;
        let savedRecords = JSON.parse(localStorage.getItem('fht_records')) || {};

        /* --- AUTHENTICATION MODAL LOGIC --- */
        function protectedAction(callbackAction) {
            pendingActionCallback = callbackAction;
            document.getElementById('authPasswordInput').value = '';
            document.getElementById('authErrorMessage').classList.add('hidden');
            const modal = document.getElementById('passwordAuthModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('authPasswordInput').focus();
        }

        function closePasswordModal() {
            const modal = document.getElementById('passwordAuthModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            pendingActionCallback = null;
        }

        function submitPasswordAuth() {
            const passwordEntered = document.getElementById('authPasswordInput').value;
            if (passwordEntered === AUTH_PASSWORD) {
                const actionToExecute = pendingActionCallback;
                closePasswordModal();
                if (actionToExecute) actionToExecute();
            } else {
                document.getElementById('authErrorMessage').classList.remove('hidden');
            }
        }

        document.getElementById('authPasswordInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') submitPasswordAuth();
        });

        function renderDashboard(data) {
            const container = document.getElementById('agentsContainer');
            container.innerHTML = '';

            const branchCounters = {};

            data.forEach((emp) => {
                if (!branchCounters[emp.branch]) branchCounters[emp.branch] = 0;
                branchCounters[emp.branch]++;
                const agentNumber = branchCounters[emp.branch];

                const card = document.createElement('div');
                // bg-white -> bg-[#ffeb99], borders ambar -> blue
                card.className = "bg-[#ffeb99] dark:bg-slate-900 border-4 border-blue-500 rounded-xl shadow-xl overflow-hidden transition-colors duration-200";

                let html = `
                    <div class="bg-blue-400 p-4 border-b-2 border-blue-600 flex flex-col lg:flex-row justify-between items-center gap-4">
                        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3">
                            <div>
                                <h2 class="font-black text-amber-600 uppercase tracking-wide inline-block">
                                    #${agentNumber} ${emp.name}
                                </h2>
                                <p class="font-bold text-amber-700 uppercase">
                                    Branch: <span class="text-blue-900 font-extrabold">${emp.branch}</span> | 
                                    Team: ${emp.team} | 
                                    Supervisor: ${emp.supervisor}
                                    ${emp.email ? ` | <span class="text-amber-600 lowercase font-extrabold">${emp.email}</span>` : ''}
                                </p>
                            </div>

                            <div class="flex items-center gap-2">
                                <button onclick="toggleCalendar('${emp.id}')" id="viewBtn_${emp.id}" class="bg-amber-600 hover:bg-amber-700 text-blue-100 font-black px-3 py-2 rounded-lg uppercase shadow-md flex items-center gap-1 border-2 border-amber-700 tracking-wider">
                                    👁️ View Team Member
                                </button>
                                <button onclick="saveAgentRecords('${emp.id}')" class="bg-green-700 hover:bg-green-800 text-white font-black px-3 py-2 rounded-lg uppercase shadow-md flex items-center gap-1 border-2 border-green-900 tracking-wider">
                                    💾 Save Records
                                </button>
                            </div>
                        </div>

                        <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
                            <div class="bg-amber-600 text-white px-3 py-1.5 rounded border border-blue-300 text-center">
                                <span class="block font-black uppercase text-blue-100">Granted</span>
                                <span id="granted_cnt_${emp.id}" class="font-black">0</span>
                            </div>
                            <div class="bg-[#15803d] text-[#fef08a] px-3 py-1.5 rounded border border-blue-300 text-center">
                                <span class="block font-black uppercase text-white">Taken</span>
                                <span id="taken_cnt_${emp.id}" class="font-black">0</span>
                            </div>
                            <div class="bg-emerald-600 text-white px-3 py-1.5 rounded border border-blue-300 text-center">
                                <span class="block font-black uppercase text-emerald-100">Vacations Taken</span>
                                <span id="vacation_cnt_${emp.id}" class="font-black">0</span>
                            </div>

                            <div class="flex flex-col items-center gap-1.5 ml-1">
                                <div class="flex items-center gap-1.5 w-full">
                                    <button onclick="protectedAction(() => editAgent('${emp.id}'))" class="w-1/2 bg-amber-600 hover:bg-amber-700 text-white font-bold px-2 py-1.5 rounded uppercase shadow text-center">
                                        ✏️ Edit
                                    </button>
                                    <button onclick="protectedAction(() => deleteAgent('${emp.id}'))" class="w-1/2 bg-red-700 hover:bg-red-800 text-white font-bold px-2 py-1.5 rounded uppercase shadow text-center">
                                        🗑️ Delete
                                    </button>
                                </div>
                                <button onclick="downloadAgentExcel('${emp.id}')" class="w-full bg-blue-600 hover:bg-blue-700 text-amber-300 font-black py-1.5 rounded uppercase shadow border border-blue-800 flex items-center justify-center gap-1">
                                    📊 Download Excel
                                </button>
                            </div>
                        </div>
                    </div>

                    <div id="calendar_${emp.id}" class="hidden p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 bg-blue-50/20 dark:bg-slate-950/40">
                `;

                monthsData.forEach((m) => {
                    html += `
                        <div class="bg-[#ffeb99] dark:bg-slate-900 border-2 border-blue-400 rounded-lg p-3 shadow">
                            <h3 class="font-black text-amber-600 dark:text-amber-300 uppercase border-b-2 border-blue-400 pb-1 mb-2 text-center bg-blue-200 dark:bg-slate-800 rounded">
                                ${m.name}
                            </h3>
                            <div class="grid grid-cols-7 gap-1 text-center font-black text-amber-600 dark:text-slate-300 mb-1 border-b dark:border-slate-800 pb-1">
                                <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                            </div>
                            <div class="grid grid-cols-7 gap-1.5">
                    `;

                    for (let empty = 0; empty < m.startDay; empty++) {
                        html += `<div class="bg-blue-50 dark:bg-slate-800/40 rounded h-24 border border-slate-200 dark:border-slate-800 opacity-30"></div>`;
                    }

                    for (let day = 1; day <= m.days; day++) {
                        const isHoliday = m.holidays[day];
                        const uniqueId = `${emp.id}_${m.name}_d${day}`;
                        const savedDayData = savedRecords[uniqueId] || {};

                        if (isHoliday) {
                            // Se cambió h-28 por h-auto min-h-[240px] para que todo quepa perfectamente, en especial los botones.
                            html += `
                                <div class="border rounded p-1.5 flex flex-col justify-start text-left h-auto min-h-[240px] relative bg-blue-100/90 dark:bg-amber-950/30 border-blue-500 gap-1">
                                    <div class="flex flex-col font-black mb-0.5">
                                        <span class="text-amber-600 dark:text-amber-200 leading-none">${day}</span>
                                        <span class="bg-blue-500 p-1 mt-1 rounded uppercase font-black text-amber-500 block text-center leading-tight" title="${isHoliday.name}">${isHoliday.name}</span>
                                    </div>

                                    <select id="status_${uniqueId}" onchange="handleHolidayChange('${uniqueId}', '${emp.id}', '${m.name}', ${day})" class="p-1 rounded border border-blue-500 font-bold focus:outline-none w-full mt-0.5 dark:bg-slate-800 dark:text-slate-100">
                                        <option value="">--</option>
                                        <option value="attended" class="status-attended" ${savedDayData.status === 'attended' ? 'selected' : ''}>Attended</option>
                                        <option value="scheduled" class="status-scheduled" ${savedDayData.status === 'scheduled' ? 'selected' : ''}>Scheduled Off</option>
                                        <option value="not-attended" class="status-not-attended" ${savedDayData.status === 'not-attended' ? 'selected' : ''}>Not Attended</option>
                                        <option value="expired" class="status-expired" ${savedDayData.status === 'expired' ? 'selected' : ''}>Expired</option>
                                        <option value="vacation" class="status-vacation" ${savedDayData.status === 'vacation' ? 'selected' : ''}>Vacation</option>
                                    </select>

                                    <select id="taken_${uniqueId}" onchange="checkEmailState('${uniqueId}', '${emp.id}', '${m.name}', ${day})" disabled class="p-1 rounded border border-blue-500 font-bold focus:outline-none w-full bg-blue-50 dark:bg-slate-800 text-slate-500 mt-0.5">
                                        <option value="none">--</option>
                                    </select>

                                    <input type="date" id="date_${uniqueId}" value="${savedDayData.date || ''}" onchange="checkEmailState('${uniqueId}', '${emp.id}', '${m.name}', ${day})" disabled class="p-1 rounded bg-blue-50 dark:bg-slate-800 border border-blue-300 dark:border-slate-700 text-slate-500 focus:outline-none w-full mt-0.5">

                                    <div id="email_btn_container_${uniqueId}" class="mt-1 w-full flex-grow"></div>
                                </div>
                            `;
                        } else {
                            html += `
                                <div class="border rounded p-1.5 flex flex-col justify-between text-left h-auto min-h-[100px] relative bg-[#ffeb99] dark:bg-slate-900 border-blue-300 dark:border-slate-800">
                                    <div class="font-black text-amber-600 dark:text-slate-200">${day}</div>

                                    <select id="status_${uniqueId}" onchange="handleRegularDayChange('${uniqueId}', '${emp.id}')" class="p-1 rounded border border-blue-300 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 font-bold focus:outline-none w-full ${savedDayData.status === 'vacation' ? 'status-vacation' : ''}">
                                        <option value="">--</option>
                                        <option value="vacation" class="status-vacation" ${savedDayData.status === 'vacation' ? 'selected' : ''}>Vacation</option>
                                    </select>
                                </div>
                            `;
                        }
                    }

                    html += `
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                card.innerHTML = html;
                container.appendChild(card);

                monthsData.forEach((m) => {
                    for (let day = 1; day <= m.days; day++) {
                        const uniqueId = `${emp.id}_${m.name}_d${day}`;
                        if (m.holidays[day]) {
                            handleHolidayChange(uniqueId, emp.id, m.name, day, true);
                            const takenSelect = document.getElementById(`taken_${uniqueId}`);
                            if (takenSelect && savedRecords[uniqueId]?.taken) {
                                takenSelect.value = savedRecords[uniqueId].taken;
                            }
                            checkEmailState(uniqueId, emp.id, m.name, day);
                        }
                    }
                });
                
                updateAgentCounters(emp.id);
            });
        }

        function toggleCalendar(empId) {
            const cal = document.getElementById(`calendar_${empId}`);
            const btn = document.getElementById(`viewBtn_${empId}`);
            if (!cal || !btn) return;

            if (cal.classList.contains('hidden')) {
                cal.classList.remove('hidden');
                btn.innerHTML = `🙈 Hide Calendar`;
                btn.classList.remove('bg-amber-600', 'text-blue-100');
                btn.classList.add('bg-blue-600', 'text-white');
            } else {
                cal.classList.add('hidden');
                btn.innerHTML = `👁️ View Team Member`;
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-amber-600', 'text-blue-100');
            }
        }

        function handleHolidayChange(id, empId, monthName, day, isInit = false) {
            const statusSelect = document.getElementById(`status_${id}`);
            const takenSelect = document.getElementById(`taken_${id}`);
            const dateInput = document.getElementById(`date_${id}`);
            if (!statusSelect) return;

            const val = statusSelect.value;
            statusSelect.classList.remove('status-attended', 'status-scheduled', 'status-not-attended', 'status-expired', 'status-vacation');

            if (val === 'attended') {
                statusSelect.classList.add('status-attended');
                takenSelect.disabled = false;
                takenSelect.className = "p-1 rounded border border-blue-500 font-extrabold focus:outline-none w-full taken-active dark:bg-slate-800";
                takenSelect.innerHTML = `
                    <option value="not-taken">Not Taken</option>
                    <option value="taken">Taken</option>
                `;
                dateInput.disabled = false;
                dateInput.className = "p-1 rounded bg-blue-100 dark:bg-slate-800 border border-blue-500 font-bold text-amber-600 dark:text-slate-100 focus:outline-none w-full";
            } else if (val === 'scheduled' || val === 'not-attended') {
                if (val === 'scheduled') statusSelect.classList.add('status-scheduled');
                if (val === 'not-attended') statusSelect.classList.add('status-not-attended');

                takenSelect.disabled = true;
                takenSelect.className = "p-1 rounded border border-blue-500 font-extrabold focus:outline-none w-full not-granted-active";
                takenSelect.innerHTML = `<option value="not-granted">Not Granted</option>`;

                dateInput.disabled = true;
                dateInput.value = "";
                dateInput.className = "p-1 rounded bg-blue-50 dark:bg-slate-800 border border-blue-300 dark:border-slate-700 text-slate-500 focus:outline-none w-full";
            } else if (val === 'expired') {
                statusSelect.classList.add('status-expired');
                takenSelect.disabled = true;
                takenSelect.className = "p-1 rounded border border-blue-500 font-extrabold focus:outline-none w-full expired-active";
                takenSelect.innerHTML = `<option value="expired">Expired</option>`;

                dateInput.disabled = true;
                dateInput.value = "";
                dateInput.className = "p-1 rounded bg-blue-50 dark:bg-slate-800 border border-blue-300 dark:border-slate-700 text-slate-500 focus:outline-none w-full";
            } else if (val === 'vacation') {
                statusSelect.classList.add('status-vacation');
                takenSelect.disabled = true;
                takenSelect.className = "p-1 rounded border border-blue-500 font-extrabold focus:outline-none w-full vacation-active";
                takenSelect.innerHTML = `<option value="vacation">Vacation</option>`;

                dateInput.disabled = true;
                dateInput.value = "";
                dateInput.className = "p-1 rounded bg-blue-50 dark:bg-slate-800 border border-blue-300 dark:border-slate-700 text-slate-500 focus:outline-none w-full";
            } else {
                takenSelect.disabled = true;
                takenSelect.className = "p-1 rounded border border-blue-500 font-extrabold focus:outline-none w-full bg-blue-50 dark:bg-slate-800 text-slate-500";
                takenSelect.innerHTML = `<option value="none">--</option>`;

                dateInput.disabled = true;
                dateInput.value = "";
                dateInput.className = "p-1 rounded bg-blue-50 dark:bg-slate-800 border border-blue-300 dark:border-slate-700 text-slate-500 focus:outline-none w-full";
            }

            if (!isInit) checkEmailState(id, empId, monthName, day);
            updateAgentCounters(empId);
        }

        function handleRegularDayChange(id, empId) {
            const statusSelect = document.getElementById(`status_${id}`);
            statusSelect.classList.remove('status-vacation');
            if (statusSelect.value === 'vacation') {
                statusSelect.classList.add('status-vacation');
            }
            updateAgentCounters(empId);
        }

        function checkEmailState(id, empId, monthName, day) {
            const statusSelect = document.getElementById(`status_${id}`);
            const takenSelect = document.getElementById(`taken_${id}`);
            const dateInput = document.getElementById(`date_${id}`);
            const container = document.getElementById(`email_btn_container_${id}`);

            if (statusSelect && takenSelect && dateInput && container) {
                if (statusSelect.value === 'attended' && takenSelect.value === 'taken' && dateInput.value !== '') {
                    // Botones modificados para mostrarse de tamaño normal usando paddings y sin clases microscopicas (py-2 px-2 en vez de py-0.5 px-0.5 text-[8px])
                    container.innerHTML = `
                        <div class="flex flex-col gap-1.5 mt-1">
                            <button onclick="sendGmail('${empId}', '${monthName} ${day}', '${dateInput.value}')" 
                                    class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-2 px-2 rounded uppercase tracking-wider shadow flex items-center justify-center gap-1">
                                ✉️ Send Gmail
                            </button>
                            <button onclick="sendConfirmationEmail('${empId}', '${monthName} ${day}', '${dateInput.value}')" 
                                    class="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-2 px-2 rounded uppercase tracking-wider shadow flex items-center justify-center">
                                📧 Default Client
                            </button>
                        </div>
                    `;
                } else {
                    container.innerHTML = '';
                }
            }
            updateAgentCounters(empId);
        }

        function saveAgentRecords(empId) {
            monthsData.forEach((m) => {
                for (let day = 1; day <= m.days; day++) {
                    const uniqueId = `${empId}_${m.name}_d${day}`;
                    const statusEl = document.getElementById(`status_${uniqueId}`);
                    const takenEl = document.getElementById(`taken_${uniqueId}`);
                    const dateEl = document.getElementById(`date_${uniqueId}`);

                    if (statusEl) {
                        savedRecords[uniqueId] = {
                            status: statusEl.value,
                            taken: angularTakenValue(takenEl),
                            date: dateEl ? dateEl.value : ''
                        };
                    }
                }
            });

            localStorage.setItem('fht_records', JSON.stringify(savedRecords));
            alert("✅ Records successfully saved! They will persist even if you refresh the browser.");
        }

        function angularTakenValue(takenEl) {
            return takenEl ? takenEl.value : '';
        }

        function downloadAgentExcel(empId) {
            const emp = employees.find(e => e.id === empId);
            if (!emp) return;

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += `Agent Name,${emp.name}\n`;
            csvContent += `Branch,${emp.branch}\n`;
            csvContent += `Team,${emp.team}\n`;
            csvContent += `Supervisor,${emp.supervisor}\n\n`;
            csvContent += "Type,Month,Day,Holiday Name,Attendance Status,Taken Status,Date Taken / Vacation Date\n";

            monthsData.forEach((m) => {
                for (let day = 1; day <= m.days; day++) {
                    const uniqueId = `${empId}_${m.name}_d${day}`;
                    const isHoliday = m.holidays[day];
                    const statusSelect = document.getElementById(`status_${uniqueId}`);
                    const takenSelect = document.getElementById(`taken_${uniqueId}`);
                    const dateInput = document.getElementById(`date_${uniqueId}`);

                    const statusVal = statusSelect ? statusSelect.value : (savedRecords[uniqueId]?.status || '');
                    const takenVal = takenSelect ? takenSelect.value : (savedRecords[uniqueId]?.taken || '');
                    const dateVal = dateInput ? dateInput.value : (savedRecords[uniqueId]?.date || '');

                    if (isHoliday) {
                        if (statusVal !== '') {
                            csvContent += `Floating Holiday,${m.name},${day},"${isHoliday.name}",${statusVal},${takenVal},${dateVal}\n`;
                        }
                    } else {
                        if (statusVal === 'vacation') {
                            csvContent += `Vacation,${m.name},${day},N/A,Vacation,N/A,${m.name} ${day}\n`;
                        }
                    }
                }
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${emp.name.replace(/\s+/g, '_')}_Holiday_Records.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function sendGmail(empId, grantedDate, dateTaken) {
            const emp = employees.find(e => e.id === empId);
            const email = emp ? emp.email : "";
            const subject = encodeURIComponent(`Floating Holiday Confirmation - ${emp ? emp.name : ''}`);
            const body = encodeURIComponent(
                `Hello ${emp ? emp.name : ''},\n\n` +
                `This email confirms that your Floating Holiday earned on ${grantedDate} has been registered as TAKEN on ${dateTaken}.\n\n` +
                `Details:\n` +
                `- Agent: ${emp ? emp.name : ''}\n` +
                `- Branch: ${emp ? emp.branch : ''}\n` +
                `- Holiday Granted Date: ${grantedDate}\n` +
                `- Date Taken: ${dateTaken}\n\n` +
                `Thank you,\n` +
                `Operations Management`
            );
            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(email)}&su=${subject}&body=${body}`;
            window.open(gmailUrl, '_blank');
        }

        function sendConfirmationEmail(empId, grantedDate, dateTaken) {
            const emp = employees.find(e => e.id === empId);
            const email = emp ? emp.email : "";
            const subject = encodeURIComponent(`Floating Holiday Confirmation - ${emp ? emp.name : ''}`);
            const body = encodeURIComponent(
                `Hello ${emp ? emp.name : ''},\n\n` +
                `This email confirms that your Floating Holiday earned on ${grantedDate} has been registered as TAKEN on ${dateTaken}.\n\n` +
                `Details:\n` +
                `- Agent: ${emp ? emp.name : ''}\n` +
                `- Branch: ${emp ? emp.branch : ''}\n` +
                `- Holiday Granted Date: ${grantedDate}\n` +
                `- Date Taken: ${dateTaken}\n\n` +
                `Thank you,\n` +
                `Operations Management`
            );
            window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
        }

        function updateAgentCounters(empId) {
            let grantedCount = 0;
            let takenCount = 0;
            let vacationCount = 0;

            monthsData.forEach((m) => {
                for (let day = 1; day <= m.days; day++) {
                    const uniqueId = `${empId}_${m.name}_d${day}`;
                    const statusSelect = document.getElementById(`status_${uniqueId}`);
                    const takenSelect = document.getElementById(`taken_${uniqueId}`);

                    const statusVal = statusSelect ? statusSelect.value : (savedRecords[uniqueId]?.status || '');
                    const takenVal = takenSelect ? takenSelect.value : (savedRecords[uniqueId]?.taken || '');

                    if (statusVal === 'attended') {
                        grantedCount++;
                        if (takenVal === 'taken') takenCount++;
                    } else if (statusVal === 'vacation') {
                        vacationCount++;
                    }
                }
            });

            const grantedEl = document.getElementById(`granted_cnt_${empId}`);
            const takenEl = document.getElementById(`taken_cnt_${empId}`);
            const vacationEl = document.getElementById(`vacation_cnt_${empId}`);

            if (grantedEl) grantedEl.innerText = grantedCount;
            if (takenEl) takenEl.innerText = takenCount;
            if (vacationEl) vacationEl.innerText = vacationCount;
        }

        function applyFilters() {
            const branchVal = document.getElementById('branchFilter').value;
            const searchVal = document.getElementById('searchFilter').value.toLowerCase();

            const filtered = employees.filter(emp => {
                const matchBranch = (emp.branch === branchVal);
                const matchSearch = emp.name.toLowerCase().includes(searchVal);
                return matchBranch && matchSearch;
            });

            renderDashboard(filtered);
        }

        function editAgent(empId) {
            const emp = employees.find(e => e.id === empId);
            if (!emp) return;

            document.getElementById('modalTitle').innerText = "Edit Agent Information";
            document.getElementById('editAgentIndex').value = empId;
            document.getElementById('modalName').value = emp.name;
            document.getElementById('modalEmail').value = emp.email || "";
            document.getElementById('modalBranch').value = emp.branch;
            document.getElementById('modalTeam').value = emp.team;
            document.getElementById('modalSupervisor').value = emp.supervisor;
            document.getElementById('agentModal').classList.remove('hidden');
            document.getElementById('agentModal').classList.add('flex');
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = "Add New Agent";
            document.getElementById('editAgentIndex').value = "-1";
            document.getElementById('modalName').value = "";
            document.getElementById('modalEmail').value = "";
            document.getElementById('modalBranch').value = "GUA";
            document.getElementById('modalTeam').value = "";
            document.getElementById('modalSupervisor').value = "";
            document.getElementById('agentModal').classList.remove('hidden');
            document.getElementById('agentModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('agentModal').classList.add('hidden');
            document.getElementById('agentModal').classList.remove('flex');
        }

        function saveAgent() {
            const empId = document.getElementById('editAgentIndex').value;
            const name = document.getElementById('modalName').value.trim();
            const email = document.getElementById('modalEmail').value.trim();
            const branch = document.getElementById('modalBranch').value;
            const team = document.getElementById('modalTeam').value.trim();
            const supervisor = document.getElementById('modalSupervisor').value.trim();

            if (!name) return alert("Agent name is required.");

            if (empId === "-1") {
                const newId = `emp_${Date.now()}`;
                employees.push({ id: newId, name, email, branch, team, supervisor });
            } else {
                const idx = employees.findIndex(e => e.id === empId);
                if (idx !== -1) {
                    employees[idx] = { id: empId, name, email, branch, team, supervisor };
                }
            }

            localStorage.setItem('fht_employees', JSON.stringify(employees));
            closeModal();
            applyFilters();
        }

        function deleteAgent(empId) {
            const emp = employees.find(e => e.id === empId);
            if (emp && confirm(`Are you sure you want to delete ${emp.name}?`)) {
                employees = employees.filter(e => e.id !== empId);
                localStorage.setItem('fht_employees', JSON.stringify(employees));
                applyFilters();
            }
        }

        function toggleDarkMode() {
            const htmlEl = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');

            if (htmlEl.classList.contains('dark')) {
                htmlEl.classList.remove('dark');
                themeIcon.innerText = '🌙';
                localStorage.setItem('fht_theme', 'light');
            } else {
                htmlEl.classList.add('dark');
                themeIcon.innerText = '☀️';
                localStorage.setItem('fht_theme', 'dark');
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('fht_theme') || 'dark';
            const htmlEl = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');

            if (savedTheme === 'dark') {
                htmlEl.classList.add('dark');
                if (themeIcon) themeIcon.innerText = '☀️';
            } else {
                htmlEl.classList.remove('dark');
                if (themeIcon) themeIcon.innerText = '🌙';
            }
        }

        window.onload = () => {
            initTheme();
            applyFilters();
        };
    </script>
</body>
</html>
